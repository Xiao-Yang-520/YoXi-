name: iOS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Flet
        run: |
          pip install --upgrade pip
          pip install flet==0.21.2 requests

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: 安装 CocoaPods
        run: |
          gem install cocoapods
          pod setup

      - name: 打包 iOS IPA
        run: |
          flet build ipa --verbose
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"

      - name: 查找 IPA 文件
        run: |
          find . -name "*.ipa" -type f
          ls -la build/ 2>/dev/null || echo "build目录不存在"

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: YoXi-Email-iOS
          path: |
            **/*.ipa
            **/*.app
          if-no-files-found: warn
          retention-days: 30
