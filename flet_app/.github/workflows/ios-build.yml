name: iOS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Flet
        run: |
          pip install --upgrade pip
          pip install flet==0.22.0

      - name: Python 语法检查
        run: |
          python -m py_compile main.py
          echo "语法检查通过"

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: 安装 CocoaPods
        run: |
          gem install cocoapods
          pod setup

      - name: 打包 iOS IPA
        run: |
          flet build ipa --verbose 2>&1 | tee build_log.txt
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"

      - name: 查看打包日志
        if: always()
        run: |
          echo "=== 日志最后200行 ==="
          tail -200 build_log.txt 2>/dev/null || echo "无日志"
          echo "=== 错误信息 ==="
          grep -i "error\|exception\|traceback\|failed\|SyntaxError\|ImportError\|ModuleNotFound" build_log.txt 2>/dev/null | tail -40 || echo "无错误信息"

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: ignore

      - name: 查找 IPA
        if: always()
        run: |
          find . -name "*.ipa" -o -name "*.app" 2>/dev/null || echo "无产物"

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: YoXi-Email-iOS
          path: |
            **/*.ipa
            **/*.app
          if-no-files-found: warn
          retention-days: 30
