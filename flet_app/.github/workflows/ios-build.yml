name: iOS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Flet
        run: |
          pip install --upgrade pip
          pip install flet==0.22.0

      - name: 查看 Flet 打包帮助
        run: |
          flet build ipa --help 2>&1 | head -50

      - name: Python 语法检查
        run: |
          python -m py_compile main.py
          echo "语法检查通过"

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: 安装 CocoaPods
        run: |
          gem install cocoapods
          pod setup

      - name: 打包 iOS IPA（未签名）
        run: |
          flet build ipa --no-codesign --verbose 2>&1 | tee build_log.txt
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"

      - name: 查看构建产物目录
        if: always()
        run: |
          echo "=== 当前目录 ==="
          pwd
          echo "=== build 目录完整结构 ==="
          ls -laR build 2>/dev/null | head -200 || echo "无 build 目录"
          echo "=== 查找 IPA ==="
          find . -name "*.ipa" -type f 2>/dev/null || echo "未找到 IPA"
          echo "=== 查找 APP ==="
          find . -name "*.app" -type d 2>/dev/null || echo "未找到 APP"
          echo "=== 日志最后150行 ==="
          tail -150 build_log.txt 2>/dev/null || echo "无日志"

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: ignore

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: YoXi-Email-iOS
          path: |
            build/ios/ipa/*.ipa
            **/*.ipa
            **/*.app
          if-no-files-found: warn
          retention-days: 30
