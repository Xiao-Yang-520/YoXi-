name: iOS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet==0.22.0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          pod setup

      - name: Create and build simple test app
        run: |
          mkdir -p /tmp/test_app
          python -c "
          with open('/tmp/test_app/main.py', 'w') as f:
              f.write('import flet as ft\n')
              f.write('def main(page: ft.Page):\n')
              f.write('    page.add(ft.Text(\"Hello\"))\n')
              f.write('ft.app(target=main)\n')
          "
          echo "=== Test app content ==="
          cat /tmp/test_app/main.py
          echo "=== Building test app ==="
          cd /tmp/test_app
          flet build --verbose ipa 2>&1 | tee /tmp/test_build_log.txt
          echo "=== Test build exit code: ${PIPESTATUS[0]} ==="
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"
        continue-on-error: true

      - name: Check test output
        if: always()
        run: |
          echo "=== Test app build dir ==="
          ls -la /tmp/test_app/build 2>/dev/null || echo "No build dir in test_app"
          echo "=== Find test IPA ==="
          find /tmp/test_app -name "*.ipa" 2>/dev/null || echo "No test IPA"
          echo "=== Test build log last 80 lines ==="
          tail -80 /tmp/test_build_log.txt 2>/dev/null || echo "No test log"

      - name: Build main app
        run: |
          echo "=== Building main app ==="
          flet build --verbose ipa 2>&1 | tee build_log.txt
          echo "=== Main build exit code: ${PIPESTATUS[0]} ==="
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"

      - name: Check main output
        if: always()
        run: |
          echo "=== Main build dir ==="
          ls -la build 2>/dev/null || echo "No build dir"
          echo "=== Find main IPA ==="
          find . -name "*.ipa" 2>/dev/null || echo "No IPA"
          echo "=== Main build log last 100 lines ==="
          tail -100 build_log.txt 2>/dev/null || echo "No build log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-logs
          path: |
            build_log.txt
            /tmp/test_build_log.txt
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YoXi-Email-iOS
          path: |
            build/**/*.ipa
            **/*.ipa
            **/*.app
          if-no-files-found: warn
          retention-days: 30
