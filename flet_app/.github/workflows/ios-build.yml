name: iOS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet==0.22.0

      - name: Python syntax check
        run: |
          python -m py_compile main.py
          echo "Syntax OK"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          pod setup

      - name: Build main app
        run: |
          echo "=== Starting build ==="
          flet build --verbose ipa 2>&1 | tee build_log.txt
          echo "=== Build exit code: ${PIPESTATUS[0]} ==="
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"

      - name: Check build output
        if: always()
        run: |
          echo "=== Current dir ==="
          pwd
          echo "=== All files ==="
          ls -la
          echo "=== build dir ==="
          ls -la build 2>/dev/null || echo "No build dir"
          echo "=== build dir recursive ==="
          find build -type f 2>/dev/null | head -100 || echo "No files"
          echo "=== Find IPA anywhere ==="
          find . -name "*.ipa" 2>/dev/null || echo "No IPA found"
          echo "=== Find APP anywhere ==="
          find . -name "*.app" 2>/dev/null || echo "No APP found"
          echo "=== Build log last 150 lines ==="
          tail -150 build_log.txt 2>/dev/null || echo "No build log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YoXi-Email-iOS
          path: |
            build/**/*.ipa
            **/*.ipa
            **/*.app
          if-no-files-found: warn
          retention-days: 30
