name: iOS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install kivy-ios
      run: |
        pip install --upgrade pip
        pip install kivy-ios

    - name: Build Python3 + Kivy + requests
      run: |
        toolchain build python3 kivy requests

    - name: Create Xcode project
      run: |
        toolchain create YaoXiEmail kivy_app/main.py

    - name: Copy config and resources
      run: |
        cp kivy_app/config.json YaoXiEmail-ios/
        cp kivy_app/requirements.txt YaoXiEmail-ios/

    - name: Import Code-Signing Certificate
      if: ${{ secrets.P12_CERTIFICATE != '' }}
      uses: apple-actions/import-codesign-certs@v3
      with:
        p12-file-base64: ${{ secrets.P12_CERTIFICATE }}
        p12-password: ${{ secrets.P12_PASSWORD }}

    - name: Install Provisioning Profile
      if: ${{ secrets.PROVISIONING_PROFILE != '' }}
      run: |
        echo "${{ secrets.PROVISIONING_PROFILE }}" | base64 --decode > profile.mobileprovision
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

    - name: Build signed IPA
      if: ${{ secrets.P12_CERTIFICATE != '' }}
      run: |
        cd YaoXiEmail-ios
        xcodebuild -project YaoXiEmail.xcodeproj \
          -scheme YaoXiEmail \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/YaoXiEmail.xcarchive \
          CODE_SIGN_IDENTITY="${{ secrets.CODE_SIGN_IDENTITY }}" \
          PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROVISIONING_PROFILE_NAME }}" \
          archive

        cat > export.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>app-store</string>
          <key>signingStyle</key>
          <string>manual</string>
        </dict>
        </plist>
        EOF

        xcodebuild -exportArchive \
          -archivePath build/YaoXiEmail.xcarchive \
          -exportPath build/export \
          -exportOptionsPlist export.plist

    - name: Build unsigned app (no certificate)
      if: ${{ secrets.P12_CERTIFICATE == '' }}
      run: |
        cd YaoXiEmail-ios
        xcodebuild -project YaoXiEmail.xcodeproj \
          -scheme YaoXiEmail \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          build

    - name: Upload signed IPA
      if: ${{ secrets.P12_CERTIFICATE != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: YaoXiEmail-iOS
        path: YaoXiEmail-ios/build/export/*.ipa

    - name: Upload unsigned app
      if: ${{ secrets.P12_CERTIFICATE == '' }}
      uses: actions/upload-artifact@v4
      with:
        name: YaoXiEmail-iOS-unsigned
        path: YaoXiEmail-ios/build/Release-iphoneos/*.app
