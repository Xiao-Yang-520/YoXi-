name: iOS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install kivy-ios
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install kivy-ios
        echo "--- Find toolchain ---"
        which toolchain || echo "toolchain not in PATH"
        python3 -m kivy_ios.toolchain --help || echo "module call failed"

    - name: Build Python3 + Kivy
      run: |
        echo "--- Building python3 ---"
        toolchain build python3
        echo "--- Building kivy ---"
        toolchain build kivy

    - name: Install requests (pure Python)
      run: |
        echo "--- Installing requests via toolchain pip ---"
        toolchain pip install requests || echo "toolchain pip failed, trying alternative"

    - name: Create Xcode project
      run: |
        echo "--- Creating Xcode project ---"
        toolchain create YaoXiEmail kivy_app/main.py
        echo "--- Project files ---"
        ls -la YaoXiEmail-ios/

    - name: Copy resources
      run: |
        cp kivy_app/config.json YaoXiEmail-ios/ || true
        cp kivy_app/requirements.txt YaoXiEmail-ios/ || true

    - name: Build unsigned app
      run: |
        cd YaoXiEmail-ios
        echo "--- Available schemes ---"
        xcodebuild -list -project YaoXiEmail.xcodeproj
        echo "--- Building ---"
        xcodebuild -project YaoXiEmail.xcodeproj \
          -scheme YaoXiEmail \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          build

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: YaoXiEmail-iOS-unsigned
        path: YaoXiEmail-ios/build/Release-iphoneos/*.app
