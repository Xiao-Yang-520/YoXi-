name: iOS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet==0.22.0

      - name: Python syntax check
        run: |
          python -m py_compile main.py
          echo "Syntax OK"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          pod setup

      - name: Create simple test app
        run: |
          python -c "
          import os
          os.makedirs('/tmp/test_app', exist_ok=True)
          with open('/tmp/test_app/main.py', 'w') as f:
              f.write('import flet as ft\n')
              f.write('def main(page: ft.Page):\n')
              f.write('    page.add(ft.Text(\"Hello\"))\n')
              f.write('ft.app(target=main)\n')
          print('Test app created')
          "
          cat /tmp/test_app/main.py

      - name: Build simple test app
        run: |
          mkdir -p /tmp/test_output
          flet build ipa /tmp/test_app --output-dir /tmp/test_output --verbose 2>&1 | tee /tmp/test_build_log.txt
          echo "Test exit code: $?"
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"
        continue-on-error: true

      - name: Check test output
        if: always()
        run: |
          echo "=== Test output dir ==="
          ls -laR /tmp/test_output 2>/dev/null | head -100 || echo "No test output dir"
          echo "=== Find test IPA ==="
          find /tmp/test_output -name "*.ipa" 2>/dev/null || echo "No test IPA found"
          echo "=== Test log last 50 lines ==="
          tail -50 /tmp/test_build_log.txt 2>/dev/null || echo "No test log"

      - name: Build main app
        run: |
          mkdir -p build_output
          flet build ipa --output-dir build_output --verbose 2>&1 | tee build_log.txt
          echo "Build exit code: $?"
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"

      - name: Check build output
        if: always()
        run: |
          echo "=== build_output dir ==="
          ls -laR build_output 2>/dev/null | head -200 || echo "No build_output dir"
          echo "=== Find IPA ==="
          find build_output -name "*.ipa" 2>/dev/null || echo "No IPA found"
          echo "=== Find APP ==="
          find build_output -name "*.app" 2>/dev/null || echo "No APP found"
          echo "=== Build log last 100 lines ==="
          tail -100 build_log.txt 2>/dev/null || echo "No build log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_log.txt
            /tmp/test_build_log.txt
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YoXi-Email-iOS
          path: |
            build_output/**/*.ipa
            **/*.ipa
            **/*.app
          if-no-files-found: warn
          retention-days: 30
