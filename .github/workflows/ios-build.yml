name: iOS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Flet
        run: |
          pip install --upgrade pip
          pip install flet==0.22.0

      - name: 查看 Flet 版本和帮助
        run: |
          echo "=== Flet 版本 ==="
          flet --version
          echo "=== build 帮助 ==="
          flet build --help 2>&1
          echo "=== build ipa 帮助 ==="
          flet build ipa --help 2>&1

      - name: Python 语法检查
        run: |
          python -m py_compile main.py
          echo "语法检查通过"

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: 安装 CocoaPods
        run: |
          gem install cocoapods
          pod setup

      - name: 打包 iOS IPA
        run: |
          flet build ipa --verbose 2>&1 | tee build_log.txt
          echo "=== 打包退出码: $? ==="
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"

      - name: 查看构建产物目录
        if: always()
        run: |
          echo "=== 当前目录 ==="
          pwd
          echo "=== 所有文件 ==="
          ls -la
          echo "=== build 目录 ==="
          ls -la build 2>/dev/null || echo "无 build 目录"
          echo "=== build 目录递归 ==="
          find build -type f 2>/dev/null | head -100 || echo "无文件"
          echo "=== 查找 IPA ==="
          find . -name "*.ipa" 2>/dev/null || echo "未找到 IPA"
          echo "=== 查找 APP ==="
          find . -name "*.app" 2>/dev/null || echo "未找到 APP"
          echo "=== 完整日志 ==="
          cat build_log.txt 2>/dev/null || echo "无日志"

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: ignore

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: YoXi-Email-iOS
          path: |
            build/ios/ipa/*.ipa
            **/*.ipa
            **/*.app
          if-no-files-found: warn
          retention-days: 30
