name: iOS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Show environment
      run: |
        echo "macOS version:"
        sw_vers
        echo "Xcode version:"
        xcodebuild -version
        echo "Python version:"
        python3 --version
        echo "Pip version:"
        pip3 --version

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install kivy-ios
      run: |
        python3 -m pip install --upgrade pip setuptools
        python3 -m pip install kivy-ios
        echo "kivy-ios installed successfully"
        toolchain --help || echo "toolchain command not found"

    - name: Build Python + Kivy
      run: |
        toolchain build python3 kivy

    - name: Build requests
      run: |
        toolchain build requests || echo "requests build failed, continuing"

    - name: Create Xcode project
      run: |
        toolchain create YaoXiEmail kivy_app/main.py
        ls -la YaoXiEmail-ios/

    - name: Copy resources
      run: |
        cp kivy_app/config.json YaoXiEmail-ios/ || true
        cp kivy_app/requirements.txt YaoXiEmail-ios/ || true

    - name: Build unsigned app
      run: |
        cd YaoXiEmail-ios
        xcodebuild -project YaoXiEmail.xcodeproj \
          -scheme YaoXiEmail \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          build

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: YaoXiEmail-iOS-unsigned
        path: YaoXiEmail-ios/build/Release-iphoneos/*.app
