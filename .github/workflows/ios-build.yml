name: iOS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet==0.22.0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          pod setup

      - name: Create test app with imports
        run: |
          mkdir -p /tmp/test_app2
          echo "import flet as ft" > /tmp/test_app2/main.py
          echo "import json" >> /tmp/test_app2/main.py
          echo "import urllib.request" >> /tmp/test_app2/main.py
          echo "import threading" >> /tmp/test_app2/main.py
          echo "import time" >> /tmp/test_app2/main.py
          echo "import os" >> /tmp/test_app2/main.py
          echo "import sys" >> /tmp/test_app2/main.py
          echo "from datetime import datetime" >> /tmp/test_app2/main.py
          echo "" >> /tmp/test_app2/main.py
          echo "def main(page: ft.Page):" >> /tmp/test_app2/main.py
          echo "    page.add(ft.Text('Test with imports'))" >> /tmp/test_app2/main.py
          echo "    data = json.dumps({'test': 123})" >> /tmp/test_app2/main.py
          echo "    page.add(ft.Text(data))" >> /tmp/test_app2/main.py
          echo "" >> /tmp/test_app2/main.py
          echo "ft.app(target=main)" >> /tmp/test_app2/main.py
          echo "=== Test app content ==="
          cat /tmp/test_app2/main.py

      - name: Build test app with imports
        run: |
          cd /tmp/test_app2
          flet build --verbose ipa 2>&1 | tee /tmp/test2_build_log.txt
          echo "=== Test2 exit code: ${PIPESTATUS[0]} ==="
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"
        continue-on-error: true

      - name: Check test2 output
        if: always()
        run: |
          echo "=== Test2 build dir ==="
          ls -laR /tmp/test_app2/build 2>/dev/null | head -50 || echo "No build dir"
          echo "=== Test2 log last 60 lines ==="
          tail -60 /tmp/test2_build_log.txt 2>/dev/null || echo "No log"

      - name: Build main app
        run: |
          echo "=== Building main app ==="
          flet build --verbose ipa 2>&1 | tee build_log.txt
          echo "=== Main exit code: ${PIPESTATUS[0]} ==="
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"

      - name: Generate unsigned IPA from xcarchive
        if: always()
        run: |
          echo "=== Looking for xcarchive ==="
          find . -name "*.xcarchive" -type d 2>/dev/null
          XCARCHIVE=$(find . -name "*.xcarchive" -type d 2>/dev/null | head -1)
          if [ -n "$XCARCHIVE" ]; then
            echo "Found xcarchive: $XCARCHIVE"
            APP_PATH="$XCARCHIVE/Products/Applications"
            echo "=== Apps in archive ==="
            ls -la "$APP_PATH" 2>/dev/null
            mkdir -p Payload
            cp -R "$APP_PATH"/*.app Payload/
            zip -r YoXi-Email-unsigned.ipa Payload/
            echo "=== Generated IPA ==="
            ls -la YoXi-Email-unsigned.ipa
          else
            echo "No xcarchive found"
          fi

      - name: Check main output
        if: always()
        run: |
          echo "=== Main build dir ==="
          ls -laR build 2>/dev/null | head -100 || echo "No build dir"
          echo "=== Find IPA ==="
          find . -name "*.ipa" 2>/dev/null
          echo "=== Find xcarchive ==="
          find . -name "*.xcarchive" -type d 2>/dev/null
          echo "=== Main log last 80 lines ==="
          tail -80 build_log.txt 2>/dev/null || echo "No log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-logs
          path: |
            build_log.txt
            /tmp/test2_build_log.txt
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YoXi-Email-iOS
          path: |
            **/*.ipa
            **/*.xcarchive
          if-no-files-found: warn
          retention-days: 30
