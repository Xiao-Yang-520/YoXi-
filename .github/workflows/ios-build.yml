name: iOS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install kivy-ios
      run: |
        pip install --upgrade pip
        pip install kivy-ios

    - name: Build Python + Kivy + requests
      run: toolchain build python3 kivy requests

    - name: Create Xcode project
      run: toolchain create YaoXiEmail kivy_app/main.py

    - name: Copy resources
      run: |
        cp kivy_app/config.json YaoXiEmail-ios/
        cp kivy_app/requirements.txt YaoXiEmail-ios/

    - name: Build unsigned app
      run: |
        cd YaoXiEmail-ios
        xcodebuild -project YaoXiEmail.xcodeproj \
          -scheme YaoXiEmail \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          build

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: YaoXiEmail-iOS-unsigned
        path: YaoXiEmail-ios/build/Release-iphoneos/*.app
