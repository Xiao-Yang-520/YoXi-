name: Build Android & iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet==0.22.0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clean up extra directories before build
        run: |
          echo "=== Files before cleanup ==="
          ls -la
          echo "=== Removing kivy_app and flet_app ==="
          rm -rf kivy_app flet_app
          echo "=== Files after cleanup ==="
          ls -la

      - name: Build Android APK
        run: |
          echo "=== Building Android APK ==="
          flet build --verbose apk --icon app_icon.png --product "YoXi邮箱" 2>&1 | tee build_log.txt
          echo "=== Build exit code: ${PIPESTATUS[0]} ==="
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"

      - name: Check build output
        if: always()
        run: |
          echo "=== build dir ==="
          ls -laR build 2>/dev/null | head -100 || echo "No build dir"
          echo "=== Find APK ==="
          find . -name "*.apk" 2>/dev/null
          echo "=== Build log last 100 lines ==="
          tail -100 build_log.txt 2>/dev/null || echo "No log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build_log.txt
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YoXi-Email-Android
          path: |
            **/*.apk
          if-no-files-found: warn
          retention-days: 30

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet==0.22.0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          pod setup

      - name: Clean up extra directories before build
        run: |
          echo "=== Files before cleanup ==="
          ls -la
          echo "=== Removing kivy_app and flet_app ==="
          rm -rf kivy_app flet_app
          echo "=== Files after cleanup ==="
          ls -la

      - name: Build iOS IPA
        run: |
          echo "=== Building iOS IPA ==="
          flet build --verbose ipa --icon app_icon.png --product "YoXi邮箱" 2>&1 | tee build_log.txt
          echo "=== Build exit code: ${PIPESTATUS[0]} ==="
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"

      - name: Generate unsigned IPA from xcarchive
        if: always()
        run: |
          echo "=== Looking for xcarchive ==="
          find . -name "*.xcarchive" -type d 2>/dev/null
          XCARCHIVE=$(find . -name "*.xcarchive" -type d 2>/dev/null | head -1)
          if [ -n "$XCARCHIVE" ]; then
            echo "Found xcarchive: $XCARCHIVE"
            APP_PATH="$XCARCHIVE/Products/Applications"
            echo "=== Apps in archive ==="
            ls -la "$APP_PATH" 2>/dev/null
            mkdir -p Payload
            cp -R "$APP_PATH"/*.app Payload/
            zip -r YoXi-Email-unsigned.ipa Payload/
            echo "=== Generated IPA ==="
            ls -la YoXi-Email-unsigned.ipa
          else
            echo "No xcarchive found"
          fi

      - name: Check build output
        if: always()
        run: |
          echo "=== build dir ==="
          ls -laR build 2>/dev/null | head -100 || echo "No build dir"
          echo "=== Find IPA ==="
          find . -name "*.ipa" 2>/dev/null
          echo "=== Find xcarchive ==="
          find . -name "*.xcarchive" -type d 2>/dev/null
          echo "=== Build log last 100 lines ==="
          tail -100 build_log.txt 2>/dev/null || echo "No log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build_log.txt
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YoXi-Email-iOS
          path: |
            **/*.ipa
            **/*.xcarchive
          if-no-files-found: warn
          retention-days: 30
