name: Build Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet==0.22.0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          flutter doctor --android-licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Clean up extra directories before build
        run: |
          echo "=== Files before cleanup ==="
          ls -la
          echo "=== Removing kivy_app and flet_app ==="
          rm -rf kivy_app flet_app
          echo "=== Files after cleanup ==="
          ls -la

      - name: Build Android APK
        run: |
          echo "=== Building Android APK ==="
          flet build --verbose apk 2>&1 | tee build_log.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "=== Build exit code: $BUILD_EXIT ==="
          exit $BUILD_EXIT
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"

      - name: Check build output
        if: always()
        run: |
          echo "=== build dir ==="
          ls -laR build 2>/dev/null | head -100 || echo "No build dir"
          echo "=== Find APK ==="
          find . -name "*.apk" 2>/dev/null
          echo "=== Build log last 150 lines ==="
          tail -150 build_log.txt 2>/dev/null || echo "No log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build_log.txt
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YoXi-Email-Android
          path: |
            **/*.apk
          if-no-files-found: warn
          retention-days: 30
