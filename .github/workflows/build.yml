name: Build iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet==0.22.0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup CocoaPods
        run: |
          sudo gem install cocoapods
          pod setup

      - name: Clean up extra directories before build
        run: |
          echo "=== Files before cleanup ==="
          ls -la
          echo "=== Removing kivy_app and flet_app ==="
          rm -rf kivy_app flet_app
          echo "=== Removing data.json (avoid auto-login) ==="
          rm -f data.json
          echo "=== Files after cleanup ==="
          ls -la

      - name: Build iOS IPA
        run: |
          echo "=== Building iOS IPA ==="
          echo "Product: YoXi邮箱"
          echo "Project: yoxi_email"
          echo "Org: com.yoxi"
          echo "Template: ./flet-template (with 3D email icon)"
          flet build --verbose ipa --product "YoXi邮箱" --project "yoxi_email" --org "com.yoxi" --template "./flet-template" 2>&1 | tee build_log.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "=== Build exit code: $BUILD_EXIT ==="
          exit $BUILD_EXIT
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"

      - name: Create IPA from xcarchive
        if: always()
        run: |
          echo "=== Searching for xcarchive ==="
          XCARCHIVE=$(find . -name "*.xcarchive" -type d 2>/dev/null | head -1)
          echo "Found xcarchive: $XCARCHIVE"
          
          echo ""
          echo "=== Searching for existing IPA ==="
          find . -name "*.ipa" -type f 2>/dev/null | tee ipa_files.txt
          
          mkdir -p output
          
          # 如果没有 IPA，从 xcarchive 创建
          if [ ! -s ipa_files.txt ] && [ -n "$XCARCHIVE" ]; then
            echo ""
            echo "=== Creating IPA from xcarchive ==="
            
            # 找到 .app 文件
            APP_PATH=$(find "$XCARCHIVE" -name "*.app" -type d 2>/dev/null | head -1)
            echo "Found app: $APP_PATH"
            
            if [ -n "$APP_PATH" ]; then
              # 创建 Payload 目录
              mkdir -p Payload
              cp -R "$APP_PATH" Payload/
              
              # 压缩为 IPA
              IPA_NAME="YoXi邮箱.ipa"
              zip -r "output/$IPA_NAME" Payload/
              
              echo ""
              echo "=== IPA created ==="
              ls -la output/
              
              # 保存 IPA 路径
              echo "output/$IPA_NAME" > ipa_files.txt
            else
              echo "No .app found in xcarchive!"
            fi
          else
            echo "IPA already exists, copying..."
            if [ -s ipa_files.txt ]; then
              while IFS= read -r ipa; do
                cp "$ipa" output/
              done < ipa_files.txt
            fi
          fi
          
          echo ""
          echo "=== xcarchive files ==="
          find . -name "*.xcarchive" -type d 2>/dev/null | tee xcarchive_files.txt
          
          echo ""
          echo "=== build directory ==="
          ls -laR build 2>/dev/null | head -100 || echo "No build dir"
          
          echo ""
          echo "=== Output dir ==="
          ls -la output/

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: |
            build_log.txt
            ipa_files.txt
            xcarchive_files.txt
          if-no-files-found: ignore

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YoXi-Email-iOS-IPA
          path: |
            output/*.ipa
            **/*.ipa
          if-no-files-found: warn
          retention-days: 30

      - name: Upload xcarchive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YoXi-Email-iOS-xcarchive
          path: |
            **/*.xcarchive
          if-no-files-found: ignore
          retention-days: 30
