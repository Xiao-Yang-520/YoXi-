name: Build iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet==0.22.0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup CocoaPods
        run: |
          sudo gem install cocoapods
          pod setup

      - name: Clean up extra directories before build
        run: |
          echo "=== Files before cleanup ==="
          ls -la
          echo "=== Removing kivy_app and flet_app ==="
          rm -rf kivy_app flet_app
          echo "=== Removing data.json (avoid auto-login) ==="
          rm -f data.json
          echo "=== Files after cleanup ==="
          ls -la

      - name: Build iOS IPA
        run: |
          echo "=== Building iOS IPA ==="
          echo "Product: YoXi邮箱"
          echo "Project: yoxi_email"
          echo "Org: com.yoxi"
          echo "Template: ./flet-template (with 3D email icon)"
          flet build --verbose ipa --product "YoXi邮箱" --project "yoxi_email" --org "com.yoxi" --template "./flet-template" 2>&1 | tee build_log.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "=== Build exit code: $BUILD_EXIT ==="
          exit $BUILD_EXIT
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"

      - name: Find and copy IPA
        if: always()
        run: |
          echo "=== Searching for IPA files ==="
          find . -name "*.ipa" -type f 2>/dev/null | tee ipa_files.txt
          
          echo ""
          echo "=== Searching for xcarchive ==="
          find . -name "*.xcarchive" -type d 2>/dev/null | tee xcarchive_files.txt
          
          echo ""
          echo "=== build directory structure ==="
          ls -laR build 2>/dev/null | head -200 || echo "No build dir"
          
          echo ""
          echo "=== Copy IPA to output dir ==="
          mkdir -p output
          if [ -s ipa_files.txt ]; then
            while IFS= read -r ipa; do
              echo "Copying: $ipa"
              cp "$ipa" output/
            done < ipa_files.txt
          else
            echo "No IPA files found!"
          fi
          
          echo ""
          echo "=== Output dir ==="
          ls -la output/

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: |
            build_log.txt
            ipa_files.txt
            xcarchive_files.txt
          if-no-files-found: ignore

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YoXi-Email-iOS-IPA
          path: |
            output/*.ipa
            **/*.ipa
          if-no-files-found: warn
          retention-days: 30

      - name: Upload xcarchive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YoXi-Email-iOS-xcarchive
          path: |
            **/*.xcarchive
          if-no-files-found: ignore
          retention-days: 30
